[versions] #######################################################################################
# Toolchain, kept in lock-step with KiteArchive / KiteTorrent / KitePDF so the Kite
# lineage builds with one shared stack.
kotlin = "2.4.10"
agp = "9.2.1"
vanniktechPublish = "0.36.0"
dokka = "2.2.0"

# Time zone data for Date. It is the one piece the engine cannot compute for itself:
# every platform ships its own IANA database and they have to agree.
kotlinxDatetime = "0.8.0"

# :kitejs-coroutines only. The engine module never sees it.
kotlinxCoroutines = "1.11.0"

# Test scope only: reading the test262 tree from disk on every target. The engine itself
# touches no files, so this must never become a runtime dependency.
kotlinxIo = "0.9.1"

# jvmTest only: upstream Rhino, pinned to the exact release the port mirrors.
# It is the differential-testing oracle. It must never become a runtime dependency.
rhino = "1.9.1"

[libraries] ######################################################################################
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
rhino-oracle = { module = "org.mozilla:rhino", version.ref = "rhino" }

[plugins] ########################################################################################
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
