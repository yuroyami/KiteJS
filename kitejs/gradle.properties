POM_NAME=KiteJS
POM_DESCRIPTION=A JavaScript engine for Kotlin Multiplatform. Runs ES5.1 and most of ES2015 and later, including regular expressions, dates, typed arrays, promises, generators, Proxy and BigInt. The parser, the regular expression engine, the date arithmetic and the number formatting are all written in common Kotlin, so a script gives the same answer on Android, iOS, JVM, JavaScript, WebAssembly, Linux, macOS and Windows. Includes a reflection-free API for binding host functions and objects. No ES2015 classes, modules or async/await.
