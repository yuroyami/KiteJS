name: CI

# Everything written in Kotlin alone. kitejs-quickjs needs C toolchains, so it has its own
# workflow, quickjs.yml, and is left out here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (JVM, Android, JS and Wasm on Node and in Chrome, Linux, ABI check)
        run: >
          ./gradlew
          :kitejs-rhino:jvmTest :kitejs-rhino:testAndroidHostTest
          :kitejs-rhino:jsNodeTest :kitejs-rhino:jsBrowserTest
          :kitejs-rhino:wasmJsNodeTest :kitejs-rhino:wasmJsBrowserTest
          :kitejs-rhino:linuxX64Test
          :kitejs-coroutines:jvmTest :kitejs-coroutines:testAndroidHostTest
          :kitejs-coroutines:jsNodeTest :kitejs-coroutines:jsBrowserTest
          :kitejs-coroutines:wasmJsNodeTest :kitejs-coroutines:wasmJsBrowserTest
          :kitejs-coroutines:linuxX64Test
          assemble check
          -x :kitejs-quickjs:assemble -x :kitejs-quickjs:check

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Apple targets (macOS and the iOS simulator)
        run: >
          ./gradlew
          :kitejs-rhino:macosArm64Test :kitejs-rhino:iosSimulatorArm64Test
          :kitejs-coroutines:macosArm64Test :kitejs-coroutines:iosSimulatorArm64Test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows target
        run: ./gradlew :kitejs-rhino:mingwX64Test :kitejs-coroutines:mingwX64Test
