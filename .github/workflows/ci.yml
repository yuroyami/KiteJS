name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (JVM, Android, JS and Wasm on Node and in Chrome, Linux, ABI check)
        run: >
          ./gradlew
          :kitejs:jvmTest :kitejs:testAndroidHostTest
          :kitejs:jsNodeTest :kitejs:jsBrowserTest
          :kitejs:wasmJsNodeTest :kitejs:wasmJsBrowserTest
          :kitejs:linuxX64Test
          :kitejs-coroutines:jvmTest :kitejs-coroutines:testAndroidHostTest
          :kitejs-coroutines:jsNodeTest :kitejs-coroutines:jsBrowserTest
          :kitejs-coroutines:wasmJsNodeTest :kitejs-coroutines:wasmJsBrowserTest
          :kitejs-coroutines:linuxX64Test
          assemble check

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Apple targets (macOS and the iOS simulator)
        run: >
          ./gradlew
          :kitejs:macosArm64Test :kitejs:iosSimulatorArm64Test
          :kitejs-coroutines:macosArm64Test :kitejs-coroutines:iosSimulatorArm64Test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows target
        run: ./gradlew :kitejs:mingwX64Test :kitejs-coroutines:mingwX64Test
