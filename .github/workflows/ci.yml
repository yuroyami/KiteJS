name: CI

# Everything written in Kotlin alone. kitejs-quickjs needs C toolchains, so it has its own
# workflow, quickjs.yml, and is left out here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build (JVM, Android, JS, Wasm, Linux, Windows)
        run: >
          ./kotlin build -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs -m kitejs-testkit
          -p jvm -p android -p js -p wasmJs -p linuxX64 -p linuxArm64 -p mingwX64
      - name: Test (JVM, Android host tests, Linux)
        run: >
          ./kotlin test --exclude-module kitejs-quickjs
          -p jvm -p android -p linuxX64
      - name: Test (JavaScript and Wasm on Node)
        run: >
          python3 tools/web-tests/run.py
          --module kitejs-api --module kitejs-rhino --module kitejs-coroutines --module kitejs
      # The other modules import the npm package @js-joda/timezone, which the toolchain's browser page cannot load.
      - name: Test (Wasm in headless Chrome, kitejs-api)
        run: ./kotlin test -m kitejs-api -p wasmJs
      - name: Check the public JVM API
        run: ./kotlin check abi -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Test (macOS and the iOS simulator)
        run: >
          ./kotlin test -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs
          -p macosArm64 -p iosSimulatorArm64
      # The klib dump covers every Kotlin/Native and web platform, and only a Mac builds them all.
      - name: Check the public klib API
        run: >
          ./kotlin build -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs
          -p iosArm64 -p iosSimulatorArm64 -p iosX64 -p macosArm64 -p linuxX64 -p linuxArm64 -p mingwX64 -p js -p wasmJs
          && ./kotlin check klibAbi -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Native stack limits
        run: >
          ./kotlin test -m kitejs-rhino -p mingwX64
          --include-classes='*WindowsStackGuardTest'
          --include-classes='*RhinoErrorsTest'
          --include-classes='*RhinoRecursionTest'
          --include-classes='*AsmBudgetTest'
      - name: Windows target
        run: ./kotlin test -m kitejs-rhino -m kitejs-coroutines -p mingwX64
