name: Publish

# A release of KiteJS: every platform built on one Mac, checked, signed and published to Maven
# Central. The workflow runs when the owner publishes a GitHub release. Run it by hand for a dry
# run, which builds and signs but uploads nothing. It never runs on a pull request.
#
# The job runs no tests. The CI and QuickJS workflows test the same commit on main.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the artifacts without uploading them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  publish:
    name: Publish to Maven Central
    # Apple platforms build only on a Mac, and a release publishes every platform from one build.
    runs-on: macos-latest
    timeout-minutes: 180
    # The secrets sit on the steps that sign or publish, not on the job, so the steps that download
    # and run the toolchain never see them. The job restores no cache: a release builds from the
    # checkout and fresh downloads only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kitejs-quickjs compiles C. zig builds the desktop JNI libraries and the WebAssembly module.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false

      # The runner image carries the NDK and sets ANDROID_NDK_HOME, which the QuickJS build reads.
      - name: Install the Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'

      # settings.publishing.version of library.module-template.yaml, the version of every module.
      - name: Read the version
        id: version
        run: |
          version=$(awk '/^  publishing:/ { found = 1 } found && /^    version:/ { print $2; exit }' library.module-template.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "KiteJS $version"

      # A release whose tag does not name the version would publish another version than the tag says.
      - name: Check that the tag names the version
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "$VERSION" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::the release tag $TAG does not name version $VERSION of library.module-template.yaml"
            exit 1
          fi

      # Three builds, one after another, so the runner compiles one group of platforms at a time.
      - name: Build (JVM and Android)
        run: >
          ./kotlin build
          -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs
          -m kitejs-quickjs -m kitejs-quickjs-android-natives
          -p jvm -p android

      - name: Build (native and web, the Kotlin modules)
        run: >
          ./kotlin build -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs
          -p iosArm64 -p iosSimulatorArm64 -p iosX64 -p macosArm64 -p linuxX64 -p linuxArm64 -p mingwX64 -p js -p wasmJs

      - name: Build (native and web, kitejs-quickjs)
        run: >
          ./kotlin build -m kitejs-quickjs
          -p iosArm64 -p iosSimulatorArm64 -p iosX64 -p macosArm64 -p linuxX64 -p linuxArm64 -p mingwX64 -p js -p wasmJs

      # A release whose public API differs from the committed references does not go out.
      - name: Check the public JVM API
        run: ./kotlin check abi -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs -m kitejs-quickjs

      - name: Check the public klib API
        run: ./kotlin check klibAbi -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs -m kitejs-quickjs

      # Every run signs into Maven Local first, so the log shows the files a release holds before
      # any upload.
      - name: Build and sign into Maven Local
        env:
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./kotlin publish mavenLocal --non-transitive
          -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs
          -m kitejs-quickjs -m kitejs-quickjs-android-natives

      - name: List the signed artifacts
        run: find ~/.m2/repository/io/github/yuroyami -type f | sort

      - name: Publish to Maven Central
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        env:
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./kotlin publish mavenCentral --non-transitive
          -m kitejs-api -m kitejs-rhino -m kitejs-coroutines -m kitejs
          -m kitejs-quickjs -m kitejs-quickjs-android-natives
