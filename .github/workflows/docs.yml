name: Docs

# Builds the MkDocs Material site and the Dokka API reference and deploys both
# to GitHub Pages (https://yuroyami.github.io/KiteJS/). The API reference lands
# at /api/ to match the "API reference" link in mkdocs.yml.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/module.yaml'
      - '**/Module.md'
      - 'project.yaml'
      - 'build-plugins/**'
      - 'dokka-templates/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Build the docs site
        run: mkdocs build --site-dir site

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # kitejs-quickjs compiles its WebAssembly module into the web sources Dokka reads.
      - name: Set up zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Generate the Dokka API reference
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: 1
        run: |
          # shellcheck disable=SC1010
          ./kotlin do dokka && ./kotlin do dokkaSite

      - name: Merge the API reference into the site
        run: |
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
