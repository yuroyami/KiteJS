name: QuickJS

# kitejs-quickjs on every platform it ships for. It compiles C: zig cross-builds the desktop JNI
# libraries and the WebAssembly module, the NDK builds Android's, and the clang Kotlin/Native
# ships builds each native target's static library. It runs when the module, or anything it is
# built on, changes.

on:
  push:
    branches: [main]
    paths:
      - 'kitejs-quickjs/**'
      - 'kitejs-api/**'
      - 'kitejs-testkit/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/quickjs.yml'
  pull_request:
    paths:
      - 'kitejs-quickjs/**'
      - 'kitejs-api/**'
      - 'kitejs-testkit/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/quickjs.yml'
  workflow_dispatch:

concurrency:
  group: quickjs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: gradle/actions/setup-gradle@v4
      # The runner image carries the NDK and sets ANDROID_NDK_HOME, which the build reads.
      - name: Build and test (JVM, Android, JS and Wasm on Node and in Chrome, Linux, ABI check)
        run: >
          ./gradlew
          :kitejs-quickjs:jvmTest :kitejs-quickjs:testAndroidHostTest
          :kitejs-quickjs:jsNodeTest :kitejs-quickjs:jsBrowserTest
          :kitejs-quickjs:wasmJsNodeTest :kitejs-quickjs:wasmJsBrowserTest
          :kitejs-quickjs:linuxX64Test
          :kitejs-quickjs:assemble :kitejs-quickjs:check

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Apple targets, and the JVM on macOS
        run: >
          ./gradlew
          :kitejs-quickjs:macosArm64Test :kitejs-quickjs:iosSimulatorArm64Test
          :kitejs-quickjs:jvmTest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows target, and the JVM on Windows
        run: ./gradlew :kitejs-quickjs:mingwX64Test :kitejs-quickjs:jvmTest
