name: test262 parity

# One producer, one immutable selection, and an explicit replay denominator on every target.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Optional test262 path prefix; empty runs the full selected corpus'
        type: string
        default: ''

permissions:
  contents: read

# A late nightly run must not cancel a run started by hand.
concurrency:
  group: test262-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Check artifact validation regressions
        run: python3 -B -m unittest discover -s tools -p 'test_test262_corpus.py'
      - name: Fetch test262 at the pinned commit
        run: bash tools/fetch-test262.sh
      - name: Compare engines and package the selected corpus
        env:
          TEST262_FILTER: ${{ inputs.filter }}
        run: python3 tools/test262.py parity --filter "$TEST262_FILTER"
      - name: Upload the validated replay artifact
        uses: actions/upload-artifact@v7
        with:
          name: test262-corpus
          path: kitejs-rhino/build/test262/corpus/
          if-no-files-found: error
      - name: Upload producer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-producer-results
          path: |
            kitejs-rhino/build/test262/*.txt
            kitejs-rhino/build/test262/*.tsv
            kitejs-rhino/build/test262/*.json
            kitejs-rhino/build/test262/summary.md
            build/reports/kitejs-rhino/jvm/
          if-no-files-found: error

  replay:
    needs: parity
    # The Windows replay took 117 minutes at f8622ae.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: jvm, cache: ~/.cache/JetBrains/Kotlin }
          - { os: ubuntu-latest, platform: android, cache: ~/.cache/JetBrains/Kotlin }
          - { os: ubuntu-latest, platform: js, cache: ~/.cache/JetBrains/Kotlin }
          - { os: ubuntu-latest, platform: wasmJs, cache: ~/.cache/JetBrains/Kotlin }
          - { os: ubuntu-latest, platform: linuxX64, cache: ~/.cache/JetBrains/Kotlin }
          - { os: macos-latest, platform: macosArm64, cache: ~/Library/Caches/JetBrains/Kotlin }
          - { os: macos-latest, platform: iosSimulatorArm64, cache: ~/Library/Caches/JetBrains/Kotlin }
          - { os: windows-latest, platform: mingwX64, cache: ~/AppData/Local/JetBrains/Kotlin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v5
        with:
          path: ${{ matrix.cache }}
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: test262-corpus
          path: kitejs-rhino/build/test262/corpus
      - name: Replay the exact selected cases and require a complete result
        shell: bash
        env:
          REPLAY_PLATFORM: ${{ matrix.platform }}
        run: python tools/test262.py replay --platform "$REPLAY_PLATFORM"
      - name: Upload target results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test262-${{ matrix.platform }}-results
          path: |
            kitejs-rhino/build/test-results/${{ matrix.platform }}/
            kitejs-rhino/build/test262/current-case.txt
          if-no-files-found: error
