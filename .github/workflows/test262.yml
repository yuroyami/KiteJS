name: test262 parity

# The whole test262 suite, through upstream Rhino and through this port, comparing the two
# outcomes file by file. It takes minutes and needs the suite fetched first, so it does not run
# on every push. Nightly, plus on demand.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: test262
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch test262 at the pinned commit
        run: ./tools/fetch-test262.sh

      - name: Run the parity check
        run: ./gradlew :kitejs:test262Parity

      - name: Upload the per-folder summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-summary
          path: |
            kitejs/build/test262/summary.md
            kitejs/build/test262/expectations.txt
          if-no-files-found: warn
