POM_NAME=KiteJS Rhino
POM_DESCRIPTION=The Rhino JavaScript engine, ported to Kotlin Multiplatform, behind the KiteJS API. Runs ES5.1 and most of ES2015 and later, including classes, async functions, regular expressions, dates, typed arrays, promises, generators, Proxy and BigInt. The parser, the interpreter, the regular expression engine, the date arithmetic and the number formatting are all written in common Kotlin, so a script gives the same answer on Android, iOS, JVM, JavaScript, WebAssembly, Linux, macOS and Windows, with no native code at all.
