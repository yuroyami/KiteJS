product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - js
    - wasmJs

description: >-
  The KiteJS JavaScript engine behind suspending functions. Awaits a JavaScript promise from Kotlin, hands a
  Deferred to a script as a promise, binds host functions that suspend, and cancels a running script when the
  calling coroutine is cancelled. The engine runs on a dispatcher that handles one call at a time, as JavaScript
  itself does.

# kitejs-coroutines puts an engine behind suspending functions. An engine is single-threaded, as JavaScript is,
# so this module gives each engine a thread of its own and hops every call onto it. It is a separate artifact so
# the engines keep their own dependencies small.

apply:
  - ../common.module-template.yaml
  - ../library.module-template.yaml

dependencies:
  - ../kitejs-api: exported
  - $libs.kotlinx.coroutines.core: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test
  # Any engine will do for the tests; Rhino needs no native code on any target.
  - ../kitejs-rhino

settings:
  kotlin:
    optIns: [ io.github.yuroyami.kitejs.api.InternalKiteJsApi ]
  android:
    namespace: io.github.yuroyami.kitejs.coroutines
  publishing:
    pom:
      name: KiteJS Coroutines

plugins:
  abi-check:
    enabled: true
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, wasmJs ]
  dokka:
    enabled: true
    moduleName: kitejs-coroutines
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: MPL-2.0 · KiteJS is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KiteJS/blob/main/kitejs-coroutines/src

# Gradle named the JVM and Android module "io.github.yuroyami:kitejs-coroutines". The name is in
# META-INF/*.kotlin_module and in the JVM names of internal members, so keep it.
settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines ]

settings@android:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines ]

# Gradle named the klib "io.github.yuroyami:kitejs-coroutines". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines, -Xshort-module-name=kitejs-coroutines ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines, -Xshort-module-name=kitejs-coroutines ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines, -Xshort-module-name=kitejs-coroutines ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines, -Xshort-module-name=kitejs-coroutines ]

settings@linuxX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines, -Xshort-module-name=kitejs-coroutines ]

settings@linuxArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines, -Xshort-module-name=kitejs-coroutines ]

settings@mingwX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitejs-coroutines, -Xshort-module-name=kitejs-coroutines ]

settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitejs-coroutines ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitejs-coroutines ]

# Tests compile into their own klib or JVM module, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test, -Xshort-module-name=kitejs-coroutines_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test, -Xshort-module-name=kitejs-coroutines_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test, -Xshort-module-name=kitejs-coroutines_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test, -Xshort-module-name=kitejs-coroutines_test ]

test-settings@linuxX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test, -Xshort-module-name=kitejs-coroutines_test ]

test-settings@linuxArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test, -Xshort-module-name=kitejs-coroutines_test ]

test-settings@mingwX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test, -Xshort-module-name=kitejs-coroutines_test ]

test-settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kitejs-coroutines_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kitejs-coroutines_test ]

test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test ]

test-settings@android:
  kotlin:
    freeCompilerArgs: [ -module-name=kitejs-coroutines_test ]
